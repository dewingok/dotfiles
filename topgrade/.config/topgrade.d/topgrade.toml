[misc]
skip_notify = false
cleanup = true
first = [
  "system",
  "brew_formula",
  "brew_cask",
  "mise"
]
disable = [
  "gem",
  "microsoft_office",
  "node",
  "pip3",
  "pnpm",
  "ruby_gems",
  "skills",
  "yarn"
]

[git]
repos = [
  "~/src/*/*/*",
]
fetch_only = true
max_concurrency = 1

[brew]
autoremove = true
