onboarding = false

[keys]
prefix = "ctrl+space"
split_vertical = ["prefix+v", "prefix+|"]
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""

[[keys.command]]
key = "prefix+h"
type = "plugin_action"
command = "herdr-splits.nav-left"

[[keys.command]]
key = "prefix+j"
type = "plugin_action"
command = "herdr-splits.nav-down"

[[keys.command]]
key = "prefix+k"
type = "plugin_action"
command = "herdr-splits.nav-up"

[[keys.command]]
key = "prefix+l"
type = "plugin_action"
command = "herdr-splits.nav-right"

[theme.custom]
accent = "#cba6f7"
panel_bg = "#181825"
sidebar_bg = "#181825"
surface_dim = "#6c7086"
overlay0 = "#9399b2"
overlay1 = "#a6adc8"

[ui]
status_indicators = "symbols"
pane_gaps = false
pane_outer_borders = false
tab_bar_right = [{ type = "zoom" }]

[ui.toast]
delivery = "terminal"
delay_seconds = 2

[ui.sound]
enabled = false

[worktrees]
directory = "~/trees"

[update]
version_check = false
manifest_check = false
