config-version = 2

after-startup-command = [
  'exec-and-forget ~/.config/borders/bordersrc',
  'layout --workspace 2 --root h_accordion',
  'layout --workspace 3 --root h_accordion',
]

start-at-login = true
auto-reload-config = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 48

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

persistent-workspaces = ["1", "2", "3", "4", "5"]

# exec-on-workspace-change = []
# on-mode-changed = []

focus-follows-mouse.enabled = false

# To find app ids: `aerospace list-apps`
on-window-detected = [
  # 2 - Ref
  {
    if = 'test %{app-bundle-id} = com.openai.codex',
    run = 'move-node-to-workspace 2',
  },
  {
    if = 'test %{app-bundle-id} = com.anthropic.claudefordesktop',
    run = 'move-node-to-workspace 2',
  },
  # 3 - Comms
  {
    if = 'test %{app-bundle-id} = com.microsoft.teams2',
    run = 'move-node-to-workspace 3',
  },
  {
    if = 'test %{app-bundle-id} = com.tinyspeck.slackmacgap',
    run = 'move-node-to-workspace 3',
  },
  {
    if = 'test %{app-bundle-id} = com.apple.MobileSMS',
    run = 'move-node-to-workspace 3',
  },
  {
    if = 'test %{app-bundle-id} = com.whispersystems.signal-desktop',
    run = 'move-node-to-workspace 3',
  },
  {
    if = 'test %{app-bundle-id} = ru.keepcoder.Telegram',
    run = 'move-node-to-workspace 3',
  },
  # 4 - Aux
  {
    if = 'test %{app-bundle-id} = com.spotify.client',
    run = 'move-node-to-workspace 4',
  },

  # Floating
  {
    if = 'test %{app-bundle-id} = com.apple.systempreferences',
    run = 'layout floating',
  },
  {
    if = 'test %{app-bundle-id} = com.apple.calculator',
    run = 'layout floating',
  },
]

[workspace-to-monitor-force-assignment]
1 = 'main'                  # Dev
2 = ['secondary', 'main']   # Ref
3 = ['secondary', 'main']   # Comms
4 = ['secondary', 'main']   # Aux
5 = 'main'                  # Temp

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 6
inner.vertical =   6
outer.left =       6
outer.bottom =     6
outer.top =        6
outer.right =      6

[mode.main.binding]
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# Focus
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move windows
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Resize
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# Workspace switching
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# Move window to workspace
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

# Workspace nav
alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

alt-q = 'close'
alt-enter = 'exec-and-forget osascript -e "tell application \"Ghostty\" to new window"'

alt-shift-semicolon = 'mode service'
alt-r = 'mode resize'

# Disable accidental macOS app hide shortcuts
cmd-h = []
cmd-alt-h = []

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']
